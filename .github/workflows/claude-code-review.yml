name: Claude Code Review

# Automatic review on every new or updated pull request.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Review pull request
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Posts a tracking comment with checkboxes and updates it as the review runs.
          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read CLAUDE.md first and hold the diff to
            the conventions it sets out.

            Focus on:

            1. **Correctness** - logic errors, unhandled edge cases, and state
               that can go stale. Flag anything that would break at runtime.
            2. **Repo conventions** - Vue components use the Options-style
               `export default { name, setup() {} }` form, not `<script setup>`.
               New user-facing strings belong in BOTH `client/src/locales/en.js`
               and `ja.js`; a key present in only one renders as a raw key.
            3. **Security** - this repository and its forks are PUBLIC. Flag any
               credential, API key, internal hostname, or private registry URL
               that appears in the diff.
            4. **Tests** - whether changed behaviour is covered by the pytest
               suite under `tests/`, and whether new edge cases need cases added.

            Leave inline comments on specific lines. Use a top-level comment for
            general observations. Be concrete: say what breaks and under what
            input, not just that something looks risky.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
